[alembic]
script_location = alembic
prepend_sys_path = .
version_locations = %(here)s/alembic/versions

# DATABASE_URL is read from the environment in env.py; this placeholder is
# here so Alembic does not complain about a missing sqlalchemy.url key when
# running in offline mode.  It is overridden at runtime by env.py.
sqlalchemy.url = postgresql://placeholder/placeholder

# Use Python's standard logging config format if you want file-based logging.
# The [logging] section below is intentionally minimal — env.py guards the
# fileConfig() call so it only runs when the full logging config is present.
