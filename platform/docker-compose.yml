version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: platform-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: easyrepo
    ports:
      - "5435:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d easyrepo"]
      interval: 3s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
