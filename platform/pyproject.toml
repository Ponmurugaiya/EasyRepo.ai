[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-intelligence"
version = "0.1.0"
description = "AI Codebase Intelligence Platform Backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.22.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "pgvector>=0.2.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "litellm>=1.40.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "procrastinate>=3.9.0",
    "psycopg[binary]>=3.3.0",
    "slowapi>=0.1.9",
    "redis>=4.6.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (require live DB + API keys, use -m 'not integration' to skip)",
]

[tool.pyright]
extraPaths = ["."]


